apiVersion: v1
kind: Service
metadata:
  name: mia-frontend-svc
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: mia-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:

    app: mia-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mia-cache-svc
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: mia-cache
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80